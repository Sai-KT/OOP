<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduBridge | Admin Console</title>
  <link rel="stylesheet" href="auth-premium.css">
  <script src="admin-login.js" defer></script>
</head>
<body class="admin-body">

  <!-- AMBIENT BACKGROUND & TEXTURE -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="grid-texture"></div>
    <div class="noise-overlay"></div>
    <div class="orb orb-admin-1"></div>
    <div class="orb orb-admin-2"></div>
    <div class="orb orb-admin-3"></div>
    <div class="scan-beam"></div>
    <canvas class="particle-canvas" id="adminParticles"></canvas>
  </div>

  <main class="admin-card" aria-label="Administrator Console Login">
    <!-- BRAND & HEADER -->
    <header class="admin-header">
      <a class="admin-brand" href="/admin-login.html">
        <div class="admin-brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div class="admin-brand-title">Edu<span>Bridge</span></div>
      </a>

      <div>
        <span class="admin-badge">
          <span class="admin-badge-dot"></span>
          Admin Console
        </span>
      </div>

      <h1 class="admin-title">System Administration</h1>
      <p class="admin-subtitle">Sign in with your master credentials</p>
    </header>

    <!-- FORM -->
    <form id="adminLoginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="adminUsername">Username</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input class="form-input" id="adminUsername" autocomplete="username" required placeholder="Administrator username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="adminPassword">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input class="form-input" id="adminPassword" type="password" autocomplete="current-password" required placeholder="Enter password">
          <button type="button" class="btn-pw-toggle" data-toggle-password="adminPassword" aria-label="Toggle password visibility">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>
            </svg>
          </button>
        </div>
        <div class="caps-warning hidden" id="adminCaps">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>Caps Lock is active</span>
        </div>
      </div>

      <div id="adminMessage" class="alert-card error hidden" role="alert"></div>

      <button class="btn-submit" id="adminSubmit" type="submit">
        <span>Sign In to Console</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </form>

    <!-- FOOTER SWITCH -->
    <footer class="admin-footer">
      <span>Are you a student?</span>
      <a href="/student-login.html">
        <span>Student Portal</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </footer>
  </main>

</body>
</html>
