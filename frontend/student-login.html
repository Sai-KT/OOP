<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusFlow | Student Portal</title>
  <link rel="stylesheet" href="auth-premium.css">
  <script src="student-login.js" defer></script>
</head>
<body class="student-body">

  <!-- AMBIENT BACKGROUND & TEXTURE -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="dot-texture"></div>
    <div class="noise-overlay"></div>
    <div class="orb orb-student-1"></div>
    <div class="orb orb-student-2"></div>
    <div class="orb orb-student-3"></div>
  </div>

  <main class="student-card" aria-label="Student Portal Login and Registration">
    <!-- BRAND & HEADER -->
    <header class="student-header">
      <a class="student-brand" href="/student-login.html">
        <div class="student-brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div class="student-brand-title">Campus<span>Flow</span></div>
      </a>

      <div>
        <span class="student-badge">Student Portal</span>
      </div>

      <h1 class="student-title" id="studentTitle">Welcome Back</h1>
      <p class="student-subtitle" id="studentSubtitle">Sign in to access your courses and grades</p>
      <span id="studentKicker" class="hidden"></span>
    </header>

    <!-- TABS: SIGN IN VS REGISTER -->
    <div class="student-tabs" role="tablist">
      <button type="button" class="student-tab-btn active" id="tabSignIn">Sign In</button>
      <button type="button" class="student-tab-btn" id="tabRegister">Register</button>
    </div>

    <!-- STUDENT SIGN IN FORM -->
    <form id="studentLoginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="studentLoginUsername">Username or Email</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input class="form-input" id="studentLoginUsername" autocomplete="username" required placeholder="Student username or email">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="studentLoginPassword">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input class="form-input" id="studentLoginPassword" type="password" autocomplete="current-password" required placeholder="Enter password">
          <button type="button" class="btn-pw-toggle" data-toggle-password="studentLoginPassword" aria-label="Toggle password visibility">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>
            </svg>
          </button>
        </div>
        <div class="caps-warning hidden" id="studentLoginCaps">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>Caps Lock is active</span>
        </div>
      </div>

      <div id="studentLoginMessage" class="alert-card error hidden" role="alert"></div>

      <button class="btn-submit" id="studentLoginSubmit" type="submit">
        <span>Sign In to Student Portal</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </form>

    <!-- STUDENT REGISTRATION FORM -->
    <form id="studentSignupForm" class="hidden" novalidate>
      <div class="form-group">
        <label class="form-label" for="studentSignupFullName">Full Name</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input class="form-input" id="studentSignupFullName" autocomplete="name" maxlength="100" required placeholder="e.g. John Doe">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="studentSignupUsername">Username</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>
            </svg>
          </span>
          <input class="form-input" id="studentSignupUsername" autocomplete="username" minlength="3" maxlength="50" required placeholder="Choose a username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="studentSignupEmail">Email</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </span>
          <input class="form-input" id="studentSignupEmail" type="email" autocomplete="email" maxlength="150" required placeholder="student@campus.edu">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="studentSignupPassword">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input class="form-input" id="studentSignupPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
          <button type="button" class="btn-pw-toggle" data-toggle-password="studentSignupPassword" aria-label="Toggle password visibility">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>
            </svg>
          </button>
        </div>
        <div class="strength-track" id="studentStrengthMeter" data-score="0">
          <span class="strength-bar"></span>
          <span class="strength-bar"></span>
          <span class="strength-bar"></span>
          <span class="strength-bar"></span>
        </div>
        <div class="field-hint" id="studentStrengthText">8+ characters recommended</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="studentSignupConfirm">Confirm Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
          <input class="form-input" id="studentSignupConfirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Re-enter password">
          <button type="button" class="btn-pw-toggle" data-toggle-password="studentSignupConfirm" aria-label="Toggle password visibility">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>
            </svg>
          </button>
        </div>
        <div class="field-hint" id="studentMatchText"></div>
      </div>

      <div id="studentSignupMessage" class="alert-card error hidden" role="alert"></div>

      <button class="btn-submit" id="studentSignupSubmit" type="submit">
        <span>Create Student Account</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </form>

    <!-- FOOTER SWITCH -->
    <footer class="student-footer">
      <span>University administrator?</span>
      <a href="/admin-login.html">
        <span>Admin Console</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </footer>
  </main>

</body>
</html>
